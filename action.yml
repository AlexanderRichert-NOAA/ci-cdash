# This action generates CDash reports for NCEPLIBS repos and pushes them to cdash.org.
#
# Alex Richert, Feb 2025

name: 'CDash'
description: 'Generate and push CDash reports'

inputs:
  package-name:
    description: 'Repo name, e.g., NCEPLIBS-ip or NCEPLIBS-g2'
    required: true
    default: ${{ github.event.repository.name }}
  extra-cmake-prefix-paths:
    description: 'Extra colon-delimited paths for CMAKE_PREFIX_PATH'
    required: false
  extra-cmake-options:
    description: 'Extra options for CMake build'
    required: false
  extra-ctest-options:
    description: 'Extra args for CTest invocation (e.g., "-L MY_LABEL")'
    required: false
  extra-apt-packages:
    description: 'Extra apt packages to install'
    required: false
  profiling:
    description: 'Enable experimental profiling measurements'
    required: false


runs:
  using: 'composite'
  steps:

    - name: "Get the modified code"
      uses: actions/checkout@v4
      with:
        path: coderoot
        submodules: true

    - name: "Generate and push reports"
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install valgrind ${{ inputs.extra-apt-packages }}
        # Get CMake and enable instrumention (requires v4.3+)
        #wget https://github.com/Kitware/CMake/releases/download/v4.3.3/cmake-4.3.3-linux-aarch64.tar.gz
        #tar xf ./cmake-4.3.3-linux-aarch64.tar.gz
        #export PATH=$PWD/cmake-4.3.3-linux-aarch64/bin:$PATH
        #export CTEST_USE_INSTRUMENTATION=ON
        ###
        cd coderoot/
        cp ${{ github.action_path }}/CTestConfig.cmake .
        if [ ${{ inputs.profiling }} == true ]; then
            pushd ${{ github.action_path }}
            git submodule update --init --recursive
            popd
            prof_arg="-DPROFILING_INCLUDE_FILE=${{ github.action_path }}/ci-profile-tests/cmake/Profiling.cmake"
        fi
        export CMAKE_PREFIX_PATH="${{ inputs.extra-cmake-prefix-paths }}:${GITHUB_WORKSPACE}/nceplibs:${GITHUB_WORKSPACE}/nceplibs/jasper:${GITHUB_WORKSPACE}/nceplibs/bacio:${GITHUB_WORKSPACE}/nceplibs/bufr:${GITHUB_WORKSPACE}/nceplibs/w3emc:${GITHUB_WORKSPACE}/nceplibs/sp:${GITHUB_WORKSPACE}/nceplibs/ip:${GITHUB_WORKSPACE}/nceplibs/g2c:${GITHUB_WORKSPACE}/nceplibs/g2:${GITHUB_WORKSPACE}/nceplibs/nemsio"
        ctest -DCTEST_SOURCE_DIRECTORY=$PWD \
          -VV --parallel 4 \
          -S ${{ github.action_path }}/RunCDash.cmake \
          ${{ inputs.extra-ctest-options }} \
          --test-dir build \
          -DCTEST_PROJECT_NAME=${{ inputs.package-name }} \
          -DGH_COMMIT_HASH="-${{ github.sha }}" \
          -DCONFIG_OPTIONS="${{ inputs.extra-cmake-options }}" \
          -DCTEST_SITE="GitHub Actions CI" \
          -DGITHUB_ACTIONS=ON \
          $prof_arg
