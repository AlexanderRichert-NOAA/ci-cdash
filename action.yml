# This action generates CDash reports for NCEPLIBS repos and pushes them to cdash.org.
#
# Alex Richert, Feb 2025

name: 'CDash'
description: 'Generate and push CDash reports'

inputs:
  package-name:
    description: 'Repo name, e.g., NCEPLIBS-ip or NCEPLIBS-g2'
    required: true
    default: ${{ github.event.repository.name }}
  source-dir:
    description: 'Path (relative to the checked-out repo root) containing the top-level CMakeLists.txt'
    required: false
    default: '.'
  extra-cmake-prefix-paths:
    description: 'Extra colon-delimited paths for CMAKE_PREFIX_PATH'
    required: false
  extra-cmake-options:
    description: 'Extra options for CMake build'
    required: false
  extra-ctest-options:
    description: 'Extra args for CTest invocation (e.g., "-L MY_LABEL")'
    required: false
  extra-apt-packages:
    description: 'Extra apt packages to install'
    required: false
  profiling:
    description: 'Build with gprof instrumentation and report via custom measurements'
    required: false
    default: 'false'
  profiling-ref:
    description: 'Branch, tag, or commit SHA of AlexanderRichert-NOAA/ci-profile-tests to use when profiling is enabled. Leave unset to use an already-checked-out copy of ci-profile-tests (e.g. when running ci-profile-tests own CI).'
    required: false
    default: ''


runs:
  using: 'composite'
  steps:

    - name: "Get the modified code"
      uses: actions/checkout@v4
      with:
        path: coderoot
        submodules: true

    - name: "Fetch ci-profile-tests"
      if: inputs.profiling == 'true' && inputs.profiling-ref != ''
      uses: actions/checkout@v4
      with:
        repository: AlexanderRichert-NOAA/ci-profile-tests
        ref: ${{ inputs.profiling-ref }}
        fetch-depth: 1
        path: coderoot/ci-profile-tests

    - name: "Generate and push reports"
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y valgrind ${{ inputs.extra-apt-packages }}
        # Get CMake and enable instrumention (requires v4.3+)
        #wget https://github.com/Kitware/CMake/releases/download/v4.3.3/cmake-4.3.3-linux-aarch64.tar.gz
        #tar xf ./cmake-4.3.3-linux-aarch64.tar.gz
        #export PATH=$PWD/cmake-4.3.3-linux-aarch64/bin:$PATH
        #export CTEST_USE_INSTRUMENTATION=ON
        ###
        cd coderoot/
        cp ${{ github.action_path }}/CTestConfig.cmake "${{ inputs.source-dir }}/"
        if [ "${{ inputs.profiling }}" == "true" ]; then
            # Prefer local cmake/Profiling.cmake (project under test IS ci-profile-tests,
            # including forks); only use the separately-fetched copy for other projects.
            if [ -f "cmake/Profiling.cmake" ]; then
                prof_arg="-DPROFILING_INCLUDE_FILE=$PWD/cmake/Profiling.cmake"
            else
                prof_arg="-DPROFILING_INCLUDE_FILE=$PWD/ci-profile-tests/cmake/Profiling.cmake"
            fi
        fi
        export CMAKE_PREFIX_PATH="${{ inputs.extra-cmake-prefix-paths }}:${GITHUB_WORKSPACE}/nceplibs:${GITHUB_WORKSPACE}/nceplibs/jasper:${GITHUB_WORKSPACE}/nceplibs/bacio:${GITHUB_WORKSPACE}/nceplibs/bufr:${GITHUB_WORKSPACE}/nceplibs/w3emc:${GITHUB_WORKSPACE}/nceplibs/sp:${GITHUB_WORKSPACE}/nceplibs/ip:${GITHUB_WORKSPACE}/nceplibs/g2c:${GITHUB_WORKSPACE}/nceplibs/g2:${GITHUB_WORKSPACE}/nceplibs/nemsio"
        ctest -DCTEST_SOURCE_DIRECTORY=$PWD/${{ inputs.source-dir }} \
          -VV --parallel 4 \
          -S ${{ github.action_path }}/RunCDash.cmake \
          ${{ inputs.extra-ctest-options }} \
          --test-dir build \
          -DCTEST_PROJECT_NAME=${{ inputs.package-name }} \
          -DGH_COMMIT_HASH="-${{ github.sha }}" \
          -DCONFIG_OPTIONS="${{ inputs.extra-cmake-options }}" \
          -DCTEST_SITE="GitHub Actions CI" \
          -DGITHUB_ACTIONS=ON \
          $prof_arg

    - name: "Upload CDash Testing artifacts"
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cdash-files-${{ inputs.package-name }}-${{ github.sha }}
        path: coderoot/build/Testing/
        if-no-files-found: warn